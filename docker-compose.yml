networks:
  agent_network:
    driver: bridge

volumes:
  nemotron-cache:
  vllm-cache:
  db-data:

services:

  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-secret}"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"
      - "7881:7881/tcp"
      - "3478:3478/udp"
      - "5349:5349/tcp"
      - "50000-50200:50000-50200/udp"
    networks: [agent_network]

  nemotron:
    build:
      context: ./services/nemotron
      dockerfile: Dockerfile
    environment:
      NEMOTRON_MODEL_NAME: nvidia/nemotron-speech-streaming-en-0.6b
      NEMOTRON_MODEL_ID: nemotron-speech-streaming
    volumes:
      - nemotron-cache:/root/.cache/huggingface
    ports:
      - "11435:8000"
    networks: [agent_network]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health | python3 -c \"import sys,json; d=json.load(sys.stdin); sys.exit(0 if d.get('model_loaded') else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 120
      start_period: 30s

  # vLLM — GPU-only. With FP8 + prefix caching + chunked prefill it dominates
  # llama.cpp on TTFT for our workload (system prompt is identical across turns,
  # so prefix caching skips re-prefilling it every turn).
  vllm:
    image: vllm/vllm-openai:latest
    command:
      - --model
      - ${VLLM_MODEL:-unsloth/gemma-4-E4B-it}
      - --served-model-name
      - ${VLLM_SERVED_NAME:-gemma}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --dtype
      - ${VLLM_DTYPE:-bfloat16}
      - --quantization
      - ${VLLM_QUANTIZATION:-fp8}
      - --max-model-len
      - ${VLLM_MAX_MODEL_LEN:-8192}
      - --gpu-memory-utilization
      - ${VLLM_GPU_MEM_UTIL:-0.85}
      - --max-num-seqs
      - ${VLLM_MAX_NUM_SEQS:-4}
      - --enable-prefix-caching
      - --enable-chunked-prefill
      - --trust-remote-code
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
      VLLM_LOGGING_LEVEL: WARNING
    volumes:
      - vllm-cache:/root/.cache/huggingface
    ports:
      # Exposed for debugging only; the agent reaches vllm over the docker
      # network at http://vllm:8000. Host 11434 is reserved for systemd ollama.
      - "11436:8000"
    networks: [agent_network]
    ipc: host
    shm_size: "8gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 120s
    restart: unless-stopped

  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    ports:
      - "8880:8880"
    networks: [agent_network]

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    env_file: .env
    environment:
      API_PORT: "4000"
      DATABASE_PATH: /data/simpatient.db
      LIVEKIT_URL_INTERNAL: http://livekit:7880
    volumes:
      - db-data:/data
    ports:
      - "4000:4000"
    networks: [agent_network]
    depends_on:
      livekit: { condition: service_started }

  livekit_agent:
    build:
      context: ./services/livekit_agent
      dockerfile: Dockerfile
    env_file: .env
    environment:
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret}
      API_BASE_URL: http://api:4000
      STT_BASE_URL: http://nemotron:8000/v1
      STT_MODEL: nemotron-speech-streaming
      LLM_BASE_URL: http://vllm:8000/v1
      LLM_MODEL: ${VLLM_SERVED_NAME:-gemma}
      KOKORO_BASE_URL: http://kokoro:8880/v1
      KOKORO_VOICE: ${KOKORO_VOICE:-af_nova}
      # Latency knobs (see .env for descriptions)
      RESPONSE_DELAY_MS: ${RESPONSE_DELAY_MS:-0}
      MIN_ENDPOINTING_DELAY: ${MIN_ENDPOINTING_DELAY:-0.5}
      MAX_ENDPOINTING_DELAY: ${MAX_ENDPOINTING_DELAY:-3.0}
      PREEMPTIVE_GENERATION: ${PREEMPTIVE_GENERATION:-true}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-150}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.7}
    networks: [agent_network]
    depends_on:
      livekit:   { condition: service_started }
      nemotron:  { condition: service_healthy }
      vllm:      { condition: service_healthy }
      kokoro:    { condition: service_started }
      api:       { condition: service_started }
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
    env_file: .env
    ports:
      - "3000:3000"
    networks: [agent_network]
    depends_on:
      api: { condition: service_started }

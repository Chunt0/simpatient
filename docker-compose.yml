networks:
  agent_network:
    driver: bridge

volumes:
  ollama-models:
  nemotron-cache:
  db-data:

services:

  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-secret}"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"
      - "7881:7881/tcp"
      - "3478:3478/udp"
      - "5349:5349/tcp"
      - "50000-50200:50000-50200/udp"
    networks: [agent_network]

  nemotron:
    build:
      context: ./services/nemotron
      dockerfile: Dockerfile
    environment:
      NEMOTRON_MODEL_NAME: nvidia/nemotron-speech-streaming-en-0.6b
      NEMOTRON_MODEL_ID: nemotron-speech-streaming
    volumes:
      - nemotron-cache:/root/.cache/huggingface
    ports:
      - "11435:8000"
    networks: [agent_network]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health | python3 -c \"import sys,json; d=json.load(sys.stdin); sys.exit(0 if d.get('model_loaded') else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 120
      start_period: 30s

  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: "0.0.0.0"
    volumes:
      - ollama-models:/root/.ollama
    networks: [agent_network]
    entrypoint: ["/bin/sh", "-c", "ollama serve & until curl -sf http://localhost:11434/api/tags >/dev/null 2>&1; do sleep 2; done && ollama pull ${OLLAMA_MODEL:-gemma4:e2b} && wait"]
    healthcheck:
      # Pass only once the model is fully pulled and listed
      test: ["CMD-SHELL", "ollama list | grep -q '${OLLAMA_MODEL:-gemma4}' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 80
      start_period: 30s

  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    ports:
      - "8880:8880"
    networks: [agent_network]

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    env_file: .env
    environment:
      API_PORT: "4000"
      DATABASE_PATH: /data/simpatient.db
      LIVEKIT_URL_INTERNAL: http://livekit:7880
    volumes:
      - db-data:/data
    ports:
      - "4000:4000"
    networks: [agent_network]
    depends_on:
      livekit: { condition: service_started }

  livekit_agent:
    build:
      context: ./services/livekit_agent
      dockerfile: Dockerfile
    env_file: .env
    environment:
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret}
      API_BASE_URL: http://api:4000
      STT_BASE_URL: http://nemotron:8000/v1
      STT_MODEL: nemotron-speech-streaming
      OLLAMA_BASE_URL: http://ollama:11434/v1
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma4:e2b}
      KOKORO_BASE_URL: http://kokoro:8880/v1
      KOKORO_VOICE: ${KOKORO_VOICE:-af_nova}
    networks: [agent_network]
    depends_on:
      livekit:   { condition: service_started }
      nemotron:  { condition: service_healthy }
      ollama:    { condition: service_healthy }
      kokoro:    { condition: service_started }
      api:       { condition: service_started }
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
    env_file: .env
    ports:
      - "3000:3000"
    networks: [agent_network]
    depends_on:
      api: { condition: service_started }

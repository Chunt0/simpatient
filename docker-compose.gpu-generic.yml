services:
  nemotron:
    build:
      args:
        NEMOTRON_BASE: nvidia/cuda:12.4.1-cudnn-runtime-ubuntu22.04
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cu124
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # vllm already declares GPU access in docker-compose.yml; nothing to override here.

  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-gpu:latest
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

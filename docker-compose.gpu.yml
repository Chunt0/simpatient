services:
  # whisper uses the CTranslate2 backend (not PyTorch), so it sidesteps the
  # torch.stft / cuFFT bug that bites nemotron and kokoro-gpu on the A6000.
  whisper:
    image: ghcr.io/speaches-ai/speaches:latest-cuda
    environment:
      CUDA_VISIBLE_DEVICES: "0"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # vllm has GPU access declared directly in docker-compose.yml since it
  # requires a GPU to run. This override file only pins CUDA_VISIBLE_DEVICES
  # to GPU 0 in case of multi-GPU hosts.
  vllm:
    environment:
      CUDA_VISIBLE_DEVICES: "0"

  # kokoro uses CPU image even in GPU mode — the GPU kokoro image triggers
  # CUFFT_INTERNAL_ERROR on RTX A6000 via torch.stft; CPU is fast enough for TTS
